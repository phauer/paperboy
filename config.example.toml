# Copy to config.toml (gitignored) and adjust.

# Folder the EPUBs are written to; one subfolder per publication.
# Share this folder with the Boox via Syncthing.
output_dir = "~/Books/Newsletters"

# Remembers which posts were processed (optional, this is the default).
# state_file = "~/Library/Application Support/paperboy/state.db"

# How many of the newest posts to convert when a publication is seen for the first time.
backfill = 3

[[publications]]
url = "https://newsletter.pragmaticengineer.com"

