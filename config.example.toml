# Copy to config.toml (gitignored) and adjust.

# Folder the EPUBs are written to; one subfolder per publication.
output_dir = "~/Books/Newsletters"

# Remembers which posts were processed (optional, this is the default).
# state_file = "~/Library/Application Support/paperboy/state.db"

# How many of the newest posts to convert when a publication is seen for the first time.
backfill = 3

[[publications]]
url = "https://newsletter.pragmaticengineer.com"

# [[publications]]
# url = "https://example.substack.com"
# backfill = 10   # overrides the default above

# Push new issues to the Boox via BOOX Drop (optional).
# The address is shown in BOOX Drop on the device; give the Boox a fixed IP in your router.
# [boox]
# url = "http://192.168.1.50:8085"
# folder = "Books/Newsletters"   # library folder on the Boox (default)

# Send new issues to the Kindles of your Amazon account via Send to Kindle (optional).
# Log in once with: paperboy kindle-login
# [kindle]
