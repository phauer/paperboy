[project]
name = "paperboy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Philipp Hauer", email = "[email]" }
]
requires-python = ">=3.13"
dependencies = [
    "ebooklib>=0.20",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
paperboy = "paperboy.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
